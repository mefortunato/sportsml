# Train the transformer, run the walk-forward backtest (challenge games,
# performance page, past power rankings) and publish the result as the
# `webdata` release asset that the daily Site workflow builds from.
# Builds are usually run on a GPU machine with `make train-local` (see
# sportsml.web.release), which publishes the same way; this workflow is the
# fallback: monthly, it reuses models that machine trained in the last 14 days
# and trains the rest, and it runs on demand, e.g. after changing the model.
# Each sport builds in its own job, in parallel. Backtest seasons are
# reused from the previous `webdata` release, or from the `backtest-cache`
# release that every build adds its seasons and models to, while the model
# and that sport's code are unchanged, so a
# routine run only trains the model for upcoming games
# (~15 min for the NFL or college football, ~20 for the NBA); a full
# backtest (after a model change, or with refresh_backtest) takes ~1 hour
# for the NFL and college football and 2-3 hours for the NBA.
name: Train

on:
  workflow_dispatch:
    inputs:
      refresh_backtest:
        description: Backtest every season again instead of reusing the last release's
        type: boolean
        default: false
      reuse_model_days:
        description: >-
          Use the backtest-cache release's model if trained (e.g. on a GPU
          machine) at most this many days ago, instead of training (0: train)
        type: number
        default: 0
  schedule:
    - cron: "41 7 1 * *" # the 1st of each month (MLB and the WNBA play all summer)

permissions:
  contents: write # the webdata release
  actions: write # start the Site workflow

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's maximum; a college basketball model trains for 1-2 hours
    timeout-minutes: 360
    strategy:
      # a sport that fails keeps its previous build (see publish)
      fail-fast: false
      matrix:
        sport: [nfl, cfb, nba, cbb, wcbb, wnba, nhl, mlb]
    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      # the keys the per-sport caches had before they were merged into one
      # step, so existing caches keep being restored
      CACHE_PREFIX: >-
        ${{ matrix.sport == 'cfb' && 'espn-cfb-' || matrix.sport == 'nba'
        && 'espn-nba-' || format('data-{0}-', matrix.sport) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-default-groups
      # Each cache is restored here and saved after the build even when it
      # fails: ESPN answers 403 to a runner after a burst of odds requests,
      # and saving the lines fetched until then lets the next run go on from
      # there instead of starting over (and being refused again).
      - name: Restore cached ESPN files and lines
        if: matrix.sport != 'nfl'
        uses: actions/cache/restore@v4
        with:
          # finished seasons' schedules and box scores (and NHL / MLB files),
          # finished games' lines (a download without it makes thousands of
          # odds requests: ~12,000 for college football, ~18,000 for the NBA,
          # ~85,000 for men's college basketball, ~35,000 for MLB)
          path: |
            data/${{ matrix.sport }}/espn_cache
            data/${{ matrix.sport }}/nhl_cache
            data/${{ matrix.sport }}/mlb_cache
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}
      - name: Restore the download cache from its release if the Actions cache was evicted
        if: matrix.sport != 'nfl'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-default-groups sportsml web pull_data --sports '[${{ matrix.sport }}]'
      - name: Fetch the previous build (its backtest seasons can be reused)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir webdata
          if gh release download webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          # the backtest-cache release: seasons (and models) any machine built
          GH_TOKEN: ${{ github.token }}
          # men's college basketball lines from CollegeBasketballData, about
          # a dozen requests a season instead of ESPN's ~5,000 (without it
          # they come from ESPN; see sportsml.cbb.data.cbbd)
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: >
          uv run sportsml web build --sports '[${{ matrix.sport }}]'
          --output_dir webdata --cache release:backtest-cache
          ${{ contains(fromJSON('["cbb", "wcbb"]'), matrix.sport) && '--max_new_seasons 1' || '' }}
          --refresh_backtest ${{ inputs.refresh_backtest || false }}
          --reuse_model_days ${{ inputs.reuse_model_days || (github.event_name == 'schedule' && 14 || 0) }}
      - name: Save the ESPN files and lines fetched so far
        if: ${{ !cancelled() && matrix.sport != 'nfl' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/${{ matrix.sport }}/espn_cache
            data/${{ matrix.sport }}/nhl_cache
            data/${{ matrix.sport }}/mlb_cache
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
      - name: Share the download cache with other machines
        if: ${{ !cancelled() && matrix.sport != 'nfl' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-default-groups sportsml web push_data --sports '[${{ matrix.sport }}]'
      - name: Pack this sport's build
        run: tar -czf webdata-${{ matrix.sport }}.tar.gz -C webdata ${{ matrix.sport }}
      - uses: actions/upload-artifact@v4
        with:
          name: webdata-${{ matrix.sport }}
          path: webdata-${{ matrix.sport }}.tar.gz
          retention-days: 3

  publish:
    needs: build
    # publish whatever built: a failed sport keeps the previous release's
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: webdata-*
          merge-multiple: true
          path: built
      - name: Unpack the sports that built
        run: |
          shopt -s nullglob
          mkdir -p built/sports
          for file in built/webdata-*.tar.gz; do
            tar -xzf "$file" -C built/sports
          done
      - name: Publish the webdata release asset and rebuild the site
        # the same as `make train-local`; a sport that failed keeps its build
        run: >
          uv run --no-default-groups sportsml web publish
          --data_dir built/sports --ref "${{ github.ref_name }}"

# Train the transformer, run the walk-forward backtest (challenge games,
# performance page, past power rankings) and publish the result as the
# `webdata` release asset that the daily Site workflow builds from.
# Runs monthly during the season and on demand, e.g. after changing the
# model. Backtest seasons are reused from the previous `webdata` release
# while the model and its code are unchanged, so a routine run only trains
# the model for upcoming games (~15 min for the NFL and college football);
# a full backtest (after a model change, or with refresh_backtest) takes
# ~1 hour.
name: Train

on:
  workflow_dispatch:
    inputs:
      refresh_backtest:
        description: Backtest every season again instead of reusing the last release's
        type: boolean
        default: false
  schedule:
    - cron: "41 7 1 1,2,9-12 *" # the 1st of each month, September-February

permissions:
  contents: write # the webdata release
  actions: write # start the Site workflow

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-default-groups
      - name: Cache CollegeFootballData responses
        uses: actions/cache@v4
        with:
          # finished seasons and weeks; CFBD's free tier is 1,000 calls a month
          path: data/cfb/cfbd_cache
          key: cfbd-${{ github.run_id }}
          restore-keys: cfbd-
      - name: Fetch the previous build (its backtest seasons can be reused)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir webdata
          if gh release download webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: >
          uv run sportsml web build --sports '[nfl, cfb]' --output_dir webdata
          --refresh_backtest ${{ inputs.refresh_backtest || false }}
      - name: Publish webdata release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf webdata.tar.gz -C webdata .
          gh release view webdata >/dev/null 2>&1 || gh release create webdata \
            --title "Web data (trained model and backtest)" --latest=false \
            --notes "Written by the Train workflow; the Site workflow builds from it."
          gh release upload webdata webdata.tar.gz --clobber
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        # Site waits for this exact asset: a download right after the upload
        # can still be served the previous one
        run: >
          gh workflow run site.yml --ref "${{ github.ref_name }}"
          -f webdata_sha256="$(sha256sum webdata.tar.gz | cut -d' ' -f1)"

# nba ablation: walk-forward over the last three complete seasons.
#   uv run sportsml nba ablate --config experiments/nba/ablation.yaml
seasons: [2024, 2025, 2026]
baseline: base
configs:
  base: {}
  efficiency:
    model: {efficiency: true}
  market_eff:                   # past-line tokens + efficiency (best on NFL)
    model: {market_tokens: true, efficiency: true}

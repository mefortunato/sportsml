# NFL ablation: walk-forward 2016-2025, each season fit on the ones before it.
#   uv run sportsml nfl ablate --config experiments/nfl/ablation.yaml
seasons: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
baseline: base
configs:
  base: {}                      # the current default transformer
  base_seed1:                   # same, another seed: the noise floor
    fit: {seed: 1}
  antisym:
    model: {antisymmetric: true}
  market:
    model: {market_tokens: true}
  efficiency:
    model: {efficiency: true}
  market_eff:
    model: {market_tokens: true, efficiency: true}
  all:
    model: {market_tokens: true, efficiency: true, antisymmetric: true}
  all_ens5:
    model: {market_tokens: true, efficiency: true, antisymmetric: true}
    fit: {ensemble: 5}

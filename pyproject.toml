[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsml"
description = "ML for sports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
version = "0.4.0.dev1"
dependencies = [
    "httpx",
    "jsonargparse[signatures]",
    "kaggle",
    "lightning",
    "mlflow",
    "networkx",
    "nflreadpy",
    "numpy",
    "omegaconf",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "torch",
    "torch_geometric",
    "torchmetrics",
    "tqdm",
]

[project.scripts]
sportsml = "sportsml.cli:cli"

[dependency-groups]
dev = ["pytest", "ruff"]
# exploration / notebook tooling; not needed by the package itself
notebooks = [
    "altair",
    "ipywidgets",
    "jupyter",
    "sbrscrape>=0.0.12",
    "seaborn",
    "umap-learn",
    "wandb>=0.25.1",
    "weave>=0.52.36",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore:Add type hints to the `predict` method:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and isort (`I`)
select = ["F", "E", "I"]
